<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/styles/login.css">
    <title>Login conatus</title>
</head>
<body>

    <div class="row g-0">
        <div class="col-lg-6 form">
             <img src="/img/Logoconatus.png" alt="logo" class="logo">

            <div class="form-content">
                
                <h2 class="titulo" ><b>Bem vindo de volta!</b></h2>

                <p class="descricao">Faça login para continuar monitorando seus projetos.</p>

                <form action="dashconsultor.html">

                    <label class="label" for="usuario">Usuário</label>
                    <input class="input" type="text" id="usuario" name="usuario" placeholder="Digite seu usuário">

                    <label class="label" for="senha">Senha</label>
                    <input class="last-input" type="password" id="senha" name="senha" placeholder="Digite sua senha">
                    <p class="esqueci"><a href="recuperar-senha.html">Esqueci minha senha</a></p>

                    <button class="button" type="submit">Login</button>
                    <p class="esqueci"><a href="./cadastro.html">Não tem conta? Cadastre-se</a></p>

                </form>
            </div>
            
        </div>


        <div class="col-lg-6 d-none d-lg-block">

            <img class="image" src="">

        </div>

    </div>
</body>
</html>
