<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Conatus{% endblock %}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ url_for('static', filename='styles/gestor.css') }}">
  {% block extra_css %}{% endblock %}
</head>
<body>
  <header class="topo bg-white">
    <div class="container-fluid px-3 px-md-4 py-2 d-flex flex-wrap align-items-center justify-content-between gap-2">
      <div class="d-flex flex-wrap align-items-center gap-2 gap-md-4">
        <a href="{{ url_for('index') }}" aria-label="Conatus — início">
          <img src="{{ url_for('static', filename='img/Logoconatus.png') }}" alt="Conatus" class="logo">
        </a>

        <!-- Change these URL paths if your dashboard routes use different addresses. -->
        <nav class="menu d-flex gap-3" aria-label="Principal">
          <a href="/gestor"
             class="menu__link{% if active_page|default('projetos') == 'projetos' %} menu__link--ativo{% endif %}"
             {% if active_page|default('projetos') == 'projetos' %}aria-current="page"{% endif %}>Projetos</a>
          <a href="/clientes"
             class="menu__link{% if active_page|default('projetos') == 'clientes' %} menu__link--ativo{% endif %}"
             {% if active_page|default('projetos') == 'clientes' %}aria-current="page"{% endif %}>Clientes</a>
        </nav>
      </div>

      <div class="d-flex align-items-center gap-3 gap-md-4">
        <span class="usuario">{{ user_role|default('Gestor') }}</span>
        {% block logout_control %}
          <!-- Wire this button to your logout route when authentication is implemented. -->
          <button type="button" class="botao-sair">Sair</button>
        {% endblock %}
      </div>
    </div>
  </header>

  <main class="container conteudo py-3 px-3">
    {% block content %}{% endblock %}
  </main>

  {% block extra_js %}{% endblock %}
</body>
</html>
