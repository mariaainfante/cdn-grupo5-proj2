
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Conatus - Nova Propriedade</title>

    <link rel="icon" type="image/png"
          href="{{ url_for('static', filename='img/conatus-icone-1024 (1).png') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='styles/comum.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/gestor.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/nova-propriedade.css') }}">
</head>

<body>

<header class="topo">
    <div class="topo__interno">

        <a href="{{ url_for('index') }}" class="marca" aria-label="Conatus">
            <img
                src="{{ url_for('static', filename='img/Logoconatus.png') }}"
                alt="Conatus"
                class="logo"
            >
        </a>

        <nav class="menu" aria-label="Navegação principal">
            <a href="{{ url_for('dashboard.gestor') }}"
               class="menu__link menu__link--ativo">
                Projetos
            </a>

            <a href="{{ url_for('dashboard.clientes') }}" class="menu__link">
                Clientes
            </a>
        </nav>

        <div class="conta">
            <span class="usuario">Gestor</span>
            <button type="button" class="botao-sair">Sair</button>
        </div>

    </div>
</header>

<main class="conteudo">

    <a href="{{ url_for('dashboard.projeto', projeto_id=projeto.id) }}">
        Voltar para o projeto
    </a>

    <h1 class="titulo">Nova propriedade</h1>
    <p class="subtitulo">
        Cadastre os dados da propriedade vinculada a este projeto.
    </p>

    <section class="propriedade-vinculada">
        <span class="propriedade-vinculada__rotulo">Projeto</span>
        {{ projeto.nome }}
    </section>

    {% if mensagem %}
        <div class="alert alert-success" role="alert">
            {{ mensagem }}
        </div>
    {% endif %}

    {% if erro %}
        <div class="alert alert-danger" role="alert">
            {{ erro }}
        </div>
    {% endif %}

    <form action="{{ url_for('dashboard.nova_propriedade', projeto_id=projeto.id) }}"
      method="POST"
      enctype="multipart/form-data">

        <section class="formulario-propriedade">

            <h2 class="formulario-propriedade__titulo">Dados da propriedade</h2>

            <div class="row g-3">

                <div class="col-md-6">
                    <label for="nome" class="form-label">
                        Nome da propriedade <span class="obrigatorio">*</span>
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="nome"
                        name="nome"
                        placeholder="Ex.: Residência Principal"
                        required
                        maxlength="100"
                        value="{{ dados.nome if dados else '' }}"
                    >
                </div>

                <div class="col-md-6">
                    <label for="tipo" class="form-label">
                        Tipo de propriedade <span class="obrigatorio">*</span>
                    </label>

                    <select class="form-select" id="tipo" name="tipo" required>
                        <option value="" disabled {% if not dados or not dados.tipo %}selected{% endif %}>
                            Selecione o tipo
                        </option>

                        <option value="residencial" {% if dados and dados.tipo == 'residencial' %}selected{% endif %}>
                            Residencial
                        </option>

                        <option value="comercial" {% if dados and dados.tipo == 'comercial' %}selected{% endif %}>
                            Comercial
                        </option>

                        <option value="industrial" {% if dados and dados.tipo == 'industrial' %}selected{% endif %}>
                            Industrial
                        </option>

                        <option value="outro" {% if dados and dados.tipo == 'outro' %}selected{% endif %}>
                            Outro
                        </option>
                    </select>
                </div>

                <div class="col-12">
                    <label for="endereco" class="form-label">Endereço</label>

                    <input
                        type="text"
                        class="form-control"
                        id="endereco"
                        name="endereco"
                        placeholder="Rua, avenida, número e complemento"
                        value="{{ dados.endereco if dados else '' }}"
                    >
                </div>

                <div class="col-md-6">
                    <label for="cidade" class="form-label">Cidade</label>

                    <input
                        type="text"
                        class="form-control"
                        id="cidade"
                        name="cidade"
                        placeholder="Ex.: São Paulo"
                        value="{{ dados.cidade if dados else '' }}"
                    >
                </div>

                <div class="col-md-6">
                    <label for="area" class="form-label">Área aproximada (m²)</label>

                    <input
                        type="number"
                        class="form-control"
                        id="area"
                        name="area"
                        min="0.01"
                        step="0.01"
                        placeholder="Ex.: 120"
                        value="{{ dados.area if dados else '' }}"
                    >
                </div>

                <div class="col-12">
                    <label for="descricao" class="form-label">Descrição</label>

                    <textarea
                        class="form-control"
                        id="descricao"
                        name="descricao"
                        rows="4"
                        placeholder="Informações adicionais sobre a propriedade..."
                    >{{ dados.descricao if dados else '' }}</textarea>
                </div>

                <div class="col-12">
                    <label for="foto" class="form-label">Foto da propriedade</label>

                    <input
                        type="file"
                        class="form-control"
                        id="foto"
                        name="foto"
                        accept="image/png, image/jpeg"
                    >

                    <small class="form-text">Formatos aceitos: JPG e PNG.</small>
                </div>

            </div>
        </section>

        <div class="acoes-propriedade">
            <button type="submit" class="botao-salvar-propriedade">
                Salvar propriedade
            </button>

            <a href="{{ url_for('dashboard.projeto', projeto_id=projeto.id) }}">
                Cancelar
            </a>
        </div>

    </form>

</main>

</body>
</html>
