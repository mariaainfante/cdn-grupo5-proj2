
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Conatus - Editar ambiente</title>

    <link rel="icon" type="image/png"
          href="{{ url_for('static', filename='img/conatus-icone-1024 (1).png') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='styles/comum.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/gestor.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/ambientes.css') }}">
</head>

<body>

    <header class="topo">
        <div class="topo__interno">

            <a href="{{ url_for('index') }}" class="marca" aria-label="Conatus">
                <img
                    src="{{ url_for('static', filename='img/Logoconatus.png') }}"
                    alt="Conatus"
                    class="logo"
                >
            </a>

            <nav class="menu" aria-label="Navegação principal">
                <a href="{{ url_for('dashboard.gestor') }}"
                   class="menu__link menu__link--ativo"
                   aria-current="page">
                    Projetos
                </a>

                <a href="{{ url_for('dashboard.clientes') }}" class="menu__link">
                    Clientes
                </a>
            </nav>

            <div class="conta">
                <span class="usuario">Gestor</span>

                <a href="{{ url_for('auth.logout') }}" class="botao-sair">
                    Sair
                </a>
            </div>

        </div>
    </header>

    <main class="conteudo">

        <a href="{{ url_for('dashboard.ambientes', propriedade_id=ambiente.propriedade_id) }}"
           class="link-voltar">
            Voltar para ambientes
        </a>

        <div class="cabecalho-ambientes">
            <div>
                <h1 class="titulo">Editar ambiente</h1>
                <p class="subtitulo">
                    Altere as informações do ambiente cadastrado.
                </p>
            </div>
        </div>

        <section class="resumo-propriedade">

            <span class="resumo-propriedade__rotulo">Propriedade</span>

            <h2 class="resumo-propriedade__nome">
                {{ ambiente.propriedade_nome }}
            </h2>

        </section>

        <section class="lista-ambientes">

            <h2 class="lista-ambientes__titulo">Dados do ambiente</h2>

            {% if erro %}
                <p class="text-danger">{{ erro }}</p>
            {% endif %}

            {% if mensagem %}
                <p class="text-success">{{ mensagem }}</p>
            {% endif %}

            <form method="POST">

                <div class="mb-3">
                    <label for="nome" class="form-label">
                        Nome do ambiente
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        class="form-control"
                        value="{{ dados.nome }}"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="tipo" class="form-label">
                        Tipo do ambiente
                    </label>

                    <input
                        type="text"
                        id="tipo"
                        name="tipo"
                        class="form-control"
                        value="{{ dados.tipo }}"
                    >
                </div>

                <div class="d-flex gap-2">

                    <button type="submit" class="botao-novo-ambiente">
                        Salvar alterações
                    </button>

                    <a href="{{ url_for('dashboard.ambientes', propriedade_id=ambiente.propriedade_id) }}"
                       class="botao-secundario">
                        Cancelar
                    </a>

                </div>

            </form>

        </section>

    </main>

</body>
</html>
