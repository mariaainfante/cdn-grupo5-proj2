
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Conatus</title>

    <link rel="icon" type="image/png"
          href="{{ url_for('static', filename='img/conatus-icone-1024 (1).png') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='styles/comum.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/gestor.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/novo-projeto.css') }}">
</head>

<body>

<header class="topo">
    <div class="topo__interno">

        <a href="{{ url_for('index') }}" class="marca" aria-label="Conatus">
            <img
                src="{{ url_for('static', filename='img/Logoconatus.png') }}"
                alt="Conatus"
                class="logo"
            >
        </a>

        <nav class="menu" aria-label="Navegação principal">
            <a href="{{ url_for('dashboard.gestor') }}"
               class="menu__link menu__link--ativo"
               aria-current="page">
                Projetos
            </a>

            <a href="{{ url_for('dashboard.clientes') }}" class="menu__link">
                Clientes
            </a>
        </nav>

        <div class="conta">
            <span class="usuario">Gestor</span>
            <button type="button" class="botao-sair">
                Sair
            </button>
        </div>

    </div>
</header>

<main class="conteudo">

    <a href="{{ url_for('dashboard.participantes', projeto_id=projeto.id_projeto) }}"
       class="link-azul d-inline-block mb-3">
        Voltar para participantes
    </a>

    <div class="introducao">
        <h1 class="titulo">Adicionar participante</h1>
        <p class="subtitulo">Projeto {{ projeto.nm_projeto }}</p>
    </div>

    {% if mensagem %}
        <div class="alert alert-success" role="alert">
            {{ mensagem }}
        </div>
    {% endif %}

    {% if erro %}
        <div class="alert alert-danger" role="alert">
            {{ erro }}
        </div>
    {% endif %}

    <div class="formulario-container">

        <form
            class="formulario bg-white border rounded-3 p-3 p-md-4"
            action="{{ url_for('dashboard.adicionar_participante', projeto_id=projeto.id_projeto) }}"
            method="POST"
        >

            <div class="mb-3">
                <label for="usuario" class="form-label">
                    Usuário existente (obrigatório)
                </label>

                <select id="usuario" name="usuario" class="form-select campo" required>
                    <option value="">Selecione um usuário</option>

                    {% for usuario in usuarios %}
                        <option
                            value="{{ usuario.id }}"
                            {% if dados.get('usuario') == usuario.id|string %}selected{% endif %}
                        >
                            {{ usuario.nome }} — {{ usuario.email }}
                        </option>
                    {% endfor %}
                </select>

                {% if not usuarios %}
                    <small class="text-muted">
                        Não existem usuários disponíveis para adicionar.
                    </small>
                {% endif %}
            </div>

            <div class="mb-3">
                <label for="papel" class="form-label">
                    Papel no projeto (obrigatório)
                </label>

                <select id="papel" name="papel" class="form-select campo" required>

                    <option value="">Selecione um papel</option>

                    <option value="gestor"
                        {% if dados.get('papel') == 'gestor' %}selected{% endif %}>
                        Gestor
                    </option>

                    <option value="tecnico"
                        {% if dados.get('papel') == 'tecnico' %}selected{% endif %}>
                        Técnico
                    </option>

                    <option value="arquiteto"
                        {% if dados.get('papel') == 'arquiteto' %}selected{% endif %}>
                        Arquiteto
                    </option>

                    <option value="comercial"
                        {% if dados.get('papel') == 'comercial' %}selected{% endif %}>
                        Comercial
                    </option>

                </select>
            </div>

            <div class="d-flex align-items-center gap-3 mt-4">
                <button type="submit" class="botao-criar"
                        {% if not usuarios %}disabled{% endif %}>
                    Adicionar participante
                </button>

                <a href="{{ url_for('dashboard.participantes', projeto_id=projeto.id_projeto) }}"
                   class="cancelar">
                    Cancelar
                </a>
            </div>

        </form>

    </div>

</main>

</body>
</html>
