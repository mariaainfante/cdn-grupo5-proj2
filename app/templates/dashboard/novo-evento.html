
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Conatus</title>

    <link rel="icon" type="image/png"
          href="{{ url_for('static', filename='img/conatus-icone-1024 (1).png') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='styles/comum.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/gestor.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/novo-projeto.css') }}">
</head>

<body>

    <header class="topo">
        <div class="topo__interno">

            <a href="{{ url_for('index') }}" class="marca" aria-label="Conatus">
                <img
                    src="{{ url_for('static', filename='img/Logoconatus.png') }}"
                    alt="Conatus"
                    class="logo"
                >
            </a>

            <nav class="menu" aria-label="Navegação principal">
                <a href="{{ url_for('dashboard.gestor') }}"
                   class="menu__link menu__link--ativo"
                   aria-current="page">
                    Projetos
                </a>

                <a href="{{ url_for('dashboard.clientes') }}" class="menu__link">
                    Clientes
                </a>
            </nav>

            <div class="conta">
                <span class="usuario">Gestor</span>

                <button type="button" class="botao-sair">
                    Sair
                </button>
            </div>

        </div>
    </header>

    <main class="conteudo">

        <a href="{{ url_for('dashboard.historico') }}" class="link-azul d-inline-block mb-3">
            Voltar para o histórico
        </a>

        <div class="introducao">
            <h1 class="titulo">Novo evento</h1>
            <p class="subtitulo">
                {{ projeto.nome if projeto else 'Projeto exemplo' }}
            </p>
        </div>

        {% if mensagem %}
            <div class="alert alert-success" role="alert">
                {{ mensagem }}
            </div>
        {% endif %}

        {% if erro %}
            <div class="alert alert-danger" role="alert">
                {{ erro }}
            </div>
        {% endif %}

        <div class="formulario-container">

            <form
                class="formulario bg-white border rounded-3 p-3 p-md-4"
                action="{{ url_for('dashboard.novo_evento') }}"
                method="POST"
            >

                <div class="mb-3">
                    <label for="titulo" class="form-label">
                        Título do evento (obrigatório)
                    </label>

                    <input
                        type="text"
                        id="titulo"
                        name="titulo"
                        class="form-control campo"
                        value="{{ dados.titulo if dados else '' }}"
                        maxlength="120"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="data" class="form-label">
                        Data do evento (obrigatória)
                    </label>

                    <input
                        type="date"
                        id="data"
                        name="data"
                        class="form-control campo"
                        value="{{ dados.data if dados else '' }}"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="descricao" class="form-label">
                        Descrição (obrigatória)
                    </label>

                    <textarea
                        id="descricao"
                        name="descricao"
                        class="form-control campo"
                        rows="5"
                        maxlength="1000"
                        required
                    >{{ dados.descricao if dados else '' }}</textarea>
                </div>

                <div class="d-flex align-items-center gap-3 mt-4">
                    <button type="submit" class="botao-criar">
                        Salvar evento
                    </button>

                    <a href="{{ url_for('dashboard.historico') }}" class="cancelar">
                        Cancelar
                    </a>
                </div>

            </form>

        </div>

    </main>

</body>
</html>
