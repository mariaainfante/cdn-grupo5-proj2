
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Conatus</title>

    <link rel="icon" type="image/png"
          href="{{ url_for('static', filename='img/conatus-icone-1024 (1).png') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='styles/comum.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/gestor.css') }}">

    <style>
        /* Voltar */
        .link-voltar {
            display: inline-block;
            margin-bottom: 22px;
            color: var(--link);
            font-size: 13px;
            text-decoration: none;
        }

        .link-voltar:hover {
            text-decoration: underline;
        }

        /* Cabeçalho */
        .cabecalho-cliente {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 24px;
        }

        /* Botão editar */
        .botao-editar {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 39px;
            padding: 0 16px;
            background: var(--azul);
            border: 1px solid var(--azul);
            border-radius: 5px;
            color: #fff;
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            transition: background 0.2s;
        }

        .botao-editar:hover {
            background: #244d7d;
            border-color: #244d7d;
            color: #fff;
        }

        /* Botão excluir */
        .botao-excluir {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 39px;
            padding: 0 16px;
            background: #fff;
            border: 1px solid #dc3545;
            border-radius: 5px;
            color: #dc3545;
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .botao-excluir:hover {
            background: #dc3545;
            color: #fff;
        }

        /* Informações */
        .dados {
            background: #fff;
            border: 1px solid #deddd7;
            border-radius: 5px;
            padding: 24px;
        }

        .dados__titulo {
            margin-bottom: 22px;
            color: var(--texto);
            font-size: 17px;
            font-weight: 600;
        }

        .dados dt {
            margin-bottom: 5px;
            color: var(--texto-suave);
            font-size: 12px;
            font-weight: 500;
        }

        .dados dd {
            margin-bottom: 20px;
            color: var(--texto);
            font-size: 14px;
        }

        .dados dd:last-child {
            margin-bottom: 0;
        }

        /* Celular */
        @media (max-width: 767px) {
            .cabecalho-cliente {
                align-items: flex-start;
                flex-direction: column;
            }

            .botao-editar,
            .botao-excluir {
                width: 100%;
            }

            .cabecalho-cliente .d-flex {
                width: 100%;
                flex-direction: column;
            }

            .cabecalho-cliente form {
                width: 100%;
            }

            .dados {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

    <header class="topo">
        <div class="topo__interno">

            <a href="{{ url_for('index') }}" class="marca" aria-label="Conatus">
                <img
                    src="{{ url_for('static', filename='img/Logoconatus.png') }}"
                    alt="Conatus"
                    class="logo"
                >
            </a>

            <nav class="menu" aria-label="Navegação principal">
                <a href="{{ url_for('dashboard.gestor') }}" class="menu__link">
                    Projetos
                </a>

                <a href="{{ url_for('dashboard.clientes') }}"
                   class="menu__link menu__link--ativo"
                   aria-current="page">
                    Clientes
                </a>
            </nav>

            <div class="conta">
                <span class="usuario">Gestor</span>

                <button type="button" class="botao-sair">
                    Sair
                </button>
            </div>

        </div>
    </header>

    <main class="conteudo">

        <a href="{{ url_for('dashboard.clientes') }}" class="link-voltar">
            Voltar para clientes
        </a>

        {% if erro %}
            <div class="alert alert-danger" role="alert">
                {{ erro }}
            </div>
        {% endif %}

        <div class="cabecalho-cliente">
            <div>
                <h1 class="titulo">{{ cliente.nome }}</h1>
                <p class="subtitulo">Informações do cliente</p>
            </div>

            <div class="d-flex align-items-center gap-2 flex-wrap">

                <a href="{{ url_for('dashboard.editar_cliente', cliente_id=cliente.id) }}"
                   class="botao-editar">
                    Editar cliente
                </a>

                <form
                    action="{{ url_for('dashboard.excluir_cliente', cliente_id=cliente.id) }}"
                    method="POST"
                    onsubmit="return confirm('Tem certeza de que deseja excluir este cliente?');"
                >
                    <button type="submit" class="botao-excluir">
                        Excluir cliente
                    </button>
                </form>

            </div>
        </div>

        <section class="dados">

            <h2 class="dados__titulo">Dados do cliente</h2>

            <dl class="mb-0">
                <dt>Nome</dt>
                <dd>{{ cliente.nome }}</dd>

                <dt>Contato</dt>
                <dd>{{ cliente.contato or 'Não informado' }}</dd>
            </dl>

        </section>

    </main>

</body>
</html>
