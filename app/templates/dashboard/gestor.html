
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Conatus</title>

    <link rel="icon" type="image/png"
          href="{{ url_for('static', filename='img/conatus-icone-1024 (1).png') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='styles/comum.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/gestor.css') }}">
</head>

<body>

    <header class="topo">
        <div class="topo__interno">

            <a href="{{ url_for('index') }}" class="marca" aria-label="Conatus">
                <img
                    src="{{ url_for('static', filename='img/Logoconatus.png') }}"
                    alt="Conatus"
                    class="logo"
                >
            </a>

            <nav class="menu" aria-label="Navegação principal">
                <a href="{{ url_for('dashboard.gestor') }}"
                   class="menu__link menu__link--ativo"
                   aria-current="page">
                    Projetos
                </a>

                <a href="{{ url_for('dashboard.clientes') }}" class="menu__link">
                    Clientes
                </a>
            </nav>

            <div class="conta">
                <span class="usuario">Gestor</span>

                <button type="button" class="botao-sair">
                    Sair
                </button>
            </div>

        </div>
    </header>


    <main class="conteudo">

        <div class="introducao">
            <h1 class="titulo">Meus Projetos</h1>

            <p class="subtitulo">
                Projetos nos quais você tem participação ativa.
            </p>
        </div>

        <div class="projetos__topo">
            <a href="{{ url_for('dashboard.novo_projeto') }}" class="novo-projeto">
                Novo Projeto
            </a>
        </div>


        <div class="lista">

            <div class="lista__cabecalho">
                <div>Nome</div>
                <div>Cliente</div>
                <div>Estado</div>
                <div>Seu papel</div>
            </div>

            <div class="lista__item">

                <div class="lista__campo">
                    <span class="rotulo">Nome</span>

                    <a href="{{ url_for('dashboard.projeto') }}" class="link-projeto">
                        Projeto exemplo
                    </a>
                </div>

                <div class="lista__campo">
                    <span class="rotulo">Cliente</span>
                    <span>Cliente exemplo</span>
                </div>

                <div class="lista__campo">
                    <span class="rotulo">Estado</span>
                    <span>Em andamento</span>
                </div>

                <div class="lista__campo">
                    <span class="rotulo">Seu papel</span>
                    <span>Gestor</span>
                </div>

            </div>

        </div>

    </main>

</body>
</html>
