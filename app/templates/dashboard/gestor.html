
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conatus - Projeto</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ url_for('static', filename='styles/gestor.css') }}">

</head>
<body>

  <header class="topo bg-white">
    <div class="container-fluid px-3 px-md-4 py-2 d-flex flex-wrap align-items-center justify-content-between gap-2">

      <div class="d-flex flex-wrap align-items-center gap-2 gap-md-4">
        <a href="{{ url_for('index') }}" aria-label="Conatus">
          <img src="{{ url_for('static', filename='img/Logoconatus.png') }}" alt="Conatus" class="logo">
        </a>

        <nav class="menu d-flex gap-3" aria-label="Principal">
          <a href="{{ url_for('dashboard.gestor') }}" class="menu__link menu__link--ativo" aria-current="page">Projetos</a>
          <a href="#" class="menu__link">Clientes</a>
        </nav>
      </div>

      <div class="d-flex align-items-center gap-3 gap-md-4">
        <span class="usuario">Gestor</span>
        <button type="button" class="botao-sair">Sair</button>
      </div>

    </div>
  </header>

  <main class="container conteudo py-3 px-3">
    <h1 class="titulo">Meus Projetos</h1>
    <p class="subtitulo">Projetos nos quais você tem participação ativa.</p>

    <a href="{{ url_for('dashboard.novo_projeto') }}" class="novo-projeto d-inline-block mb-3">Novo Projeto</a>

    <div class="lista bg-white rounded-3 border overflow-hidden">

      <div class="lista__cabecalho row g-0 px-3 py-3 d-none d-md-flex">
        <div class="col-md-4">Nome</div>
        <div class="col-md-3">Cliente</div>
        <div class="col-md-3">Estado</div>
        <div class="col-md-2">Seu papel</div>
      </div>

      <div class="lista__item row g-0 px-3 py-3 border-top align-items-center">
        <div class="col-12 col-md-4">
          <span class="rotulo d-md-none">Nome</span>
          <a href="{{ url_for('dashboard.projeto') }}" class="link-projeto">Projeto exemplo</a>
        </div>
        <div class="col-12 col-md-3">
          <span class="rotulo d-md-none">Cliente</span>
          Cliente exemplo
        </div>
        <div class="col-12 col-md-3">
          <span class="rotulo d-md-none">Estado</span>
          <span class="selo">Em andamento</span>
        </div>
        <div class="col-12 col-md-2">
          <span class="rotulo d-md-none">Seu papel</span>
          Gestor
        </div>
      </div>

    </div>
  </main>

</body>
</html>
