
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conatus</title>

  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/conatus-icone-1024 (1).png') }}">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ url_for('static', filename='styles/gestor.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/novo-projeto.css') }}">
</head>

<body>

  <header class="topo bg-white">
    <div class="container-fluid px-3 px-md-4 py-2 d-flex flex-wrap align-items-center justify-content-between gap-2">

      <div class="d-flex flex-wrap align-items-center gap-2 gap-md-4">
        <a href="{{ url_for('index') }}" aria-label="Conatus">
          <img src="{{ url_for('static', filename='img/Logoconatus.png') }}" alt="Conatus" class="logo">
        </a>

        <nav class="menu d-flex gap-3" aria-label="Principal">
          <a href="{{ url_for('dashboard.gestor') }}" class="menu__link menu__link--ativo" aria-current="page">Projetos</a>
          <a href="{{ url_for('dashboard.clientes') }}" class="menu__link">Clientes</a>
        </nav>
      </div>

      <div class="d-flex align-items-center gap-3 gap-md-4">
        <span class="usuario">Gestor</span>
        <button type="button" class="botao-sair">Sair</button>
      </div>

    </div>
  </header>

  <main class="container conteudo py-3 px-3">

    <a href="{{ url_for('dashboard.projeto') }}" class="link-azul d-inline-block mb-3">
      Voltar para o projeto
    </a>

    <h1 class="titulo mb-1">Editar projeto</h1>
    <p class="subtitulo mb-4">Projeto</p>

    {% if mensagem %}
      <div class="alert alert-success" role="alert">
        {{ mensagem }}
      </div>
    {% endif %}

    {% if erro %}
      <div class="alert alert-danger" role="alert">
        {{ erro }}
      </div>
    {% endif %}

    <div class="row">
      <div class="col-12 col-md-9 col-lg-6">

        <form
          class="formulario bg-white border rounded-3 p-3 p-md-4"
          action="{{ url_for('dashboard.editar_projeto') }}"
          method="POST"
        >

          <div class="mb-3">
            <label for="nome" class="form-label">Nome (obrigatório)</label>

            <input
              type="text"
              id="nome"
              name="nome"
              class="form-control campo"
              value="{{ dados.nome if dados else '' }}"
              required
            >
          </div>

          <div class="mb-3">
            <label for="descricao" class="form-label">Descrição (obrigatório)</label>

            <textarea
              id="descricao"
              name="descricao"
              rows="4"
              class="form-control campo"
              required
            >{{ dados.descricao if dados else '' }}</textarea>
          </div>

          <div class="mb-3">
            <label for="inicio" class="form-label">Início previsto (opcional)</label>

            <input
              type="date"
              id="inicio"
              name="inicio"
              class="form-control campo"
              value="{{ dados.inicio if dados else '' }}"
            >
          </div>

          <div class="mb-3">
            <label for="termino" class="form-label">Término previsto (opcional)</label>

            <input
              type="date"
              id="termino"
              name="termino"
              class="form-control campo"
              value="{{ dados.termino if dados else '' }}"
            >
          </div>

          <div class="mb-3">
            <label for="estado" class="form-label">Estado (obrigatório)</label>

            <select id="estado" name="estado" class="form-select campo" required>
              <option value="planejado" {% if dados and dados.estado == 'planejado' %}selected{% endif %}>
                Planejado
              </option>

              <option value="em-andamento" {% if dados and dados.estado == 'em-andamento' %}selected{% endif %}>
                Em andamento
              </option>
            </select>
          </div>

          <div class="d-flex align-items-center gap-3 mt-4">
            <button type="submit" class="botao-criar">Salvar alterações</button>

            <a href="{{ url_for('dashboard.projeto') }}" class="cancelar">
              Cancelar
            </a>
          </div>

        </form>

      </div>
    </div>
  </main>

</body>
</html>
