
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Editar cliente | Conatus</title>

    <link rel="icon" type="image/png"
          href="{{ url_for('static', filename='img/conatus-icone-1024 (1).png') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='styles/comum.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/gestor.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/novo-projeto.css') }}">
</head>

<body>

    <header class="topo">
        <div class="topo__interno">

            <a href="{{ url_for('index') }}" class="marca" aria-label="Conatus">
                <img
                    src="{{ url_for('static', filename='img/Logoconatus.png') }}"
                    alt="Conatus"
                    class="logo"
                >
            </a>

            <nav class="menu" aria-label="Navegação principal">
                <a href="{{ url_for('dashboard.gestor') }}" class="menu__link">
                    Projetos
                </a>

                <a href="{{ url_for('dashboard.clientes') }}"
                   class="menu__link menu__link--ativo"
                   aria-current="page">
                    Clientes
                </a>
            </nav>

            <div class="conta">
                <span class="usuario">Gestor</span>

                <button type="button" class="botao-sair">
                    Sair
                </button>
            </div>

        </div>
    </header>

    <main class="conteudo">

        <a href="{{ url_for('dashboard.info_cliente') }}" class="link-voltar">
            Voltar para o cliente
        </a>

        <div class="introducao">
            <h1 class="titulo">Editar cliente</h1>
            <p class="subtitulo">
                Altere os dados do cliente.
            </p>
        </div>

        <div class="formulario-container">

            <form
                class="formulario bg-white border rounded-3 p-3 p-md-4"
                action="{{ url_for('dashboard.editar_cliente') }}"
                method="post"
            >

                <div class="mb-3">
                    <label for="nome" class="form-label">
                        Nome (obrigatório)
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        class="form-control campo"
                        value="{{ dados.nome if dados else 'Cliente exemplo' }}"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="contato" class="form-label">
                        Contato (opcional)
                    </label>

                    <input
                        type="text"
                        id="contato"
                        name="contato"
                        class="form-control campo"
                        value="{{ dados.contato if dados else 'contato@example.com' }}"
                    >
                </div>

                <div class="d-flex align-items-center gap-3 mt-4">
                    <button type="submit" class="botao-criar">
                        Salvar
                    </button>

                    <a href="{{ url_for('dashboard.info_cliente') }}" class="cancelar">
                        Cancelar
                    </a>
                </div>

            </form>

        </div>

    </main>

</body>
</html>
