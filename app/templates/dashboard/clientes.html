
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conatus</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/conatus-icone-1024 (1).png') }}">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ url_for('static', filename='styles/gestor.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/comum.css') }}">
</head>
<body>

  <header class="topo bg-white">
    <div class="container-fluid px-3 px-md-4 py-2 d-flex flex-wrap align-items-center justify-content-between gap-2">

      <div class="d-flex flex-wrap align-items-center gap-2 gap-md-4">
        <a href="{{ url_for('index') }}" aria-label="Conatus">
          <img src="{{ url_for('static', filename='img/Logoconatus.png') }}" alt="Conatus" class="logo">
        </a>

        <nav class="menu d-flex gap-3" aria-label="Principal">
          <a href="{{ url_for('dashboard.gestor') }}" class="menu__link">Projetos</a>
          <a href="{{ url_for('dashboard.clientes') }}" class="menu__link menu__link--ativo" aria-current="page">Clientes</a>
        </nav>
      </div>

      <div class="d-flex align-items-center gap-3 gap-md-4">
        <span class="usuario">Gestor</span>
        <button type="button" class="botao-sair">Sair</button>
      </div>

    </div>
  </header>

  <main class="container conteudo py-3 px-3">
    <h1 class="titulo">Clientes</h1>
    <p class="subtitulo">Identificação e contato dos clientes.</p>

    <a href="{{ url_for('dashboard.novo_cliente') }}" class="link-azul d-inline-block mb-3">Novo cliente</a>

    <div class="lista bg-white rounded-3 border overflow-hidden">
      <div class="lista__cabecalho row g-0 px-3 py-3 d-none d-md-flex">
        <div class="col-md-6">Nome</div>
        <div class="col-md-6">Contato</div>
      </div>

      <div class="lista__item row g-0 px-3 py-3 border-top align-items-center">
        <div class="col-12 col-md-6">
          <span class="rotulo d-md-none">Nome</span>
          <a href="{{ url_for('dashboard.info_cliente') }}" class="link-projeto fw-bold">Cliente</a>
        </div>
        <div class="col-12 col-md-6">
          <span class="rotulo d-md-none">Contato</span>
          contato@example.com
        </div>
      </div>

    </div>
  </main>

</body>
</html>
