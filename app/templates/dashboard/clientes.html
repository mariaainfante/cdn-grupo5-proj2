
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Conatus</title>

    <link rel="icon" type="image/png"
          href="{{ url_for('static', filename='img/conatus-icone-1024 (1).png') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='styles/comum.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/gestor.css') }}">
</head>

<body>

    <header class="topo">
        <div class="topo__interno">

            <a href="{{ url_for('index') }}" class="marca" aria-label="Conatus">
                <img
                    src="{{ url_for('static', filename='img/Logoconatus.png') }}"
                    alt="Conatus"
                    class="logo"
                >
            </a>

            <nav class="menu" aria-label="Navegação principal">

                <a href="{{ url_for('dashboard.gestor') }}" class="menu__link">
                    Projetos
                </a>

                <a href="{{ url_for('dashboard.clientes') }}"
                   class="menu__link menu__link--ativo"
                   aria-current="page">
                    Clientes
                </a>

            </nav>

            <div class="conta">
                <span class="usuario">Gestor</span>

                <button type="button" class="botao-sair">
                    Sair
                </button>
            </div>

        </div>
    </header>


    <main class="conteudo">

        <div class="introducao">
            <h1 class="titulo">Clientes</h1>

            <p class="subtitulo">
                Identificação e contato dos clientes.
            </p>
        </div>

        <div class="projetos__topo">
            <a href="{{ url_for('dashboard.novo_cliente') }}" class="novo-projeto">
                Novo cliente
            </a>
        </div>


        <div class="lista lista--clientes">

            <div class="lista__cabecalho">
                <div>Nome</div>
                <div>Contato</div>
            </div>

            {% if clientes %}

                {% for cliente in clientes %}

                    <div class="lista__item">

                        <div class="lista__campo">
                            <span class="rotulo">Nome</span>

                            <a href="{{ url_for('dashboard.info_cliente', cliente_id=cliente.id) }}"
                            class="link-projeto">
                                {{ cliente.nome }}
                            </a>
                        </div>

                        <div class="lista__campo">
                            <span class="rotulo">Contato</span>

                            {{ cliente.contato or 'Não informado' }}
                        </div>

                    </div>

                {% endfor %}

            {% else %}

                <div class="lista__vazia">
                    Nenhum cliente cadastrado.
                </div>

            {% endif %}

        </div>

    </main>

</body>
</html>
