<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="{{ url_for('static', filename='styles/new-senha.css') }}">

    <title>Conatus</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/conatus-icone-1024 (1).png') }}">
</head>
<body>

    <div class="row g-0">
        <div class="col-lg-6 form">

            <img src="{{ url_for('static', filename='img/Logoconatus.png') }}" alt="logo" class="logo">

            <div class="form-content">

                <h2 class="titulo"><b>Recuperar senha!</b></h2>

                <p class="descricao">Informe sua nova senha.</p>

                {% if mensagem %}
                    <p>{{ mensagem }}</p>
                {% endif %}

                <form action="{{ url_for('auth.nova_senha') }}" method="post">

                    <label class="label" for="senha">Nova senha</label>
                    <input
                        class="input"
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua nova senha"
                        required
                    >

                    <label class="label" for="confirmar-senha">Confirmar nova senha</label>
                    <input
                        class="input"
                        type="password"
                        id="confirmar-senha"
                        name="confirmar-senha"
                        placeholder="Digite sua nova senha novamente"
                        required
                    >

                    <button class="button" type="submit">Cadastrar nova senha</button>

                    {% if sucesso %}
                        <p class="esqueci">
                            <a href="{{ url_for('auth.login') }}">Voltar para o login</a>
                        </p>
                    {% endif %}

                </form>
            </div>

        </div>

        <div class="col-lg-6 d-none d-lg-block">
            <img class="image" src="https://marketplace.canva.com/NHGTY/MAG8tGNHGTY/1/tl/canva-fundo-azul-escuro-s%C3%B3lido-MAG8tGNHGTY.jpg" alt="imagem-doida">
        </div>

    </div>

</body>
</html>
