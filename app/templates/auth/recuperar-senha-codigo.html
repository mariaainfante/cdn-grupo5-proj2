<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="{{ url_for('static', filename='styles/recuperar-senha-codigo.css') }}">

    <title>Conatus</title>
</head>
<body>

    <div class="row g-0">
        <div class="col-lg-6 form">

            <img src="{{ url_for('static', filename='img/Logoconatus.png') }}" alt="logo" class="logo">

            <div class="form-content">

                <h2 class="titulo"><b>Recuperar senha!</b></h2>

                <p class="descricao">Informe o código enviado para o seu E-mail.</p>

                {% if mensagem %}
                    <p>{{ mensagem }}</p>
                {% endif %}

                <form action="{{ url_for('auth.recuperar_senha_codigo') }}" method="post">

                    <div class="codigo">

                        <input type="text" name="codigo1" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                        <input type="text" name="codigo2" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                        <input type="text" name="codigo3" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                        <input type="text" name="codigo4" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                        <input type="text" name="codigo5" maxlength="1" pattern="[0-9]" inputmode="numeric" required>

                    </div>

                    <button class="button" type="submit">Enviar</button>

                    <p class="esqueci">
                        <a href="{{ url_for('auth.recuperar_senha') }}">Enviar código novamente</a>
                    </p>

                </form>
            </div>

        </div>

        <div class="col-lg-6 d-none d-lg-block">
            <img class="image" src="https://marketplace.canva.com/NHGTY/MAG8tGNHGTY/1/tl/canva-fundo-azul-escuro-s%C3%B3lido-MAG8tGNHGTY.jpg" alt="imagem-doida">
        </div>

    </div>

    <script>

        const formulario = document.querySelector("form");
        const campos = document.querySelectorAll(".codigo input");

        campos.forEach((campo, index) => {

            campo.addEventListener("input", function() {

                this.value = this.value.replace(/[^0-9]/g, "");

                if (this.value.length === 1) {

                    if (index < campos.length - 1) {
                        campos[index + 1].focus();
                    } else {
                        formulario.requestSubmit();
                    }

                }

            });

            campo.addEventListener("keydown", function(event) {

                if (event.key === "Backspace" && this.value === "" && index > 0) {
                    campos[index - 1].focus();
                }

            });

        });

    </script>

</body>
</html>
