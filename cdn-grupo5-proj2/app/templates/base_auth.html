<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Conatus{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous"
    >
    {% block page_css %}{% endblock %}
</head>
<body>
    <div class="row g-0">
        <div class="col-lg-6 form">
            <img
                src="{{ url_for('static', filename='img/Logoconatus.png') }}"
                alt="Logo Conatus"
                class="logo"
            >

            <div class="form-content">
                <h2 class="titulo"><b>{% block heading %}{% endblock %}</b></h2>
                <p class="descricao">{% block description %}{% endblock %}</p>

                {% block form_content %}{% endblock %}
            </div>
        </div>

        <div class="col-lg-6 d-none d-lg-block">
            <img
                class="image"
                src="https://marketplace.canva.com/NHGTY/MAG8tGNHGTY/1/tl/canva-fundo-azul-escuro-s%C3%B3lido-MAG8tGNHGTY.jpg"
                alt=""
            >
        </div>
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
